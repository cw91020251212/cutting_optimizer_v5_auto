<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#096aa5">
  <title>鍵盤工具列對照測試</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #f2f6fa;
      color: #172a3b;
      font: 17px/1.55 system-ui, -apple-system, sans-serif;
    }
    main { width: min(100%, 640px); margin: auto; padding: 24px 18px 48px; }
    h1 { font-size: 1.45rem; line-height: 1.25; margin: 0 0 14px; }
    p { margin: 0 0 14px; }
    .intro { color: #465969; }
    section {
      background: #fff;
      border: 1px solid #dbe5ed;
      border-radius: 14px;
      padding: 18px;
      margin-top: 14px;
      box-shadow: 0 3px 10px #153a5710;
    }
    label, .label { display: block; font-weight: 700; margin-bottom: 10px; }
    input, [contenteditable] {
      display: block;
      width: 100%;
      min-height: 52px;
      padding: 10px 13px;
      border: 2px solid #7998ad;
      border-radius: 9px;
      background: #fff;
      color: #152c3e;
      font: 21px/1.3 system-ui, -apple-system, sans-serif;
      outline: none;
    }
    input:focus, [contenteditable]:focus { border-color: #0078ba; box-shadow: 0 0 0 3px #0078ba25; }
    [contenteditable]:empty::before { content: attr(data-placeholder); color: #738492; }
    .hint { margin: 10px 0 0; color: #4e6271; font-size: .85rem; }
    a { color: #00669e; }
    footer { margin-top: 22px; font-size: .83rem; color: #4e6271; }
  </style>
</head>
<body>
  <main>
    <h1>鍵盤工具列對照測試</h1>
    <p class="intro">用<strong>同一部手機、同一個 Chrome</strong>，逐個點下面三格，睇吓數字鍵盤同「鑰匙／卡片／定位」三個圖示有冇出現。呢頁唔會儲存或傳送你輸入嘅內容。</p>
    <section>
      <label for="native-number">A　原本嘅數字欄</label>
      <input id="native-number" type="number" inputmode="decimal" autocomplete="off" placeholder="例如 123.5">
      <p class="hint">同切料程式而家嘅主要數字欄相同。</p>
    </section>
    <section>
      <label for="numeric-text">B　文字欄＋數字鍵盤提示</label>
      <input id="numeric-text" type="text" inputmode="decimal" autocomplete="off" placeholder="例如 123.5">
      <p class="hint">唔喺聚焦後切換型別，測試「轉型」本身會唔會重新叫出圖示。</p>
    </section>
    <section>
      <div class="label" id="editable-label">C　非表單編輯區＋數字鍵盤提示</div>
      <div id="editable-numeric" role="textbox" aria-labelledby="editable-label" aria-multiline="false" contenteditable="plaintext-only" inputmode="decimal" data-placeholder="例如 123.5"></div>
      <p class="hint">呢格唔係 HTML input；若有數字鍵盤而冇三圖示，先值得考慮點樣安全接返切料程式。</p>
    </section>
    <footer><a href="./">返回切料程式</a> · 呢個係獨立測試頁，冇改動正式輸入流程。</footer>
  </main>
</body>
</html>
